<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTask | Task Manager - Aditya Teotia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar (EduPro Dashboard Style) -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <h2>EduTask</h2>
          <span>Student Planner</span>
        </div>
      </div>

      <div class="profile-box">
        <div class="avatar">AT</div>
        <div class="profile-info">
          <h4>Aditya Teotia</h4>
          <p>K.I.E.T Deemed To Be University</p>
        </div>
      </div>

      <nav class="filter-menu">
        <p class="menu-label">TASK VIEWS</p>
        <button class="filter-btn active" data-filter="all">
          📋 All Tasks <span id="count-all" class="badge">0</span>
        </button>
        <button class="filter-btn" data-filter="pending">
          ⏳ Pending <span id="count-pending" class="badge">0</span>
        </button>
        <button class="filter-btn" data-filter="completed">
          ✅ Completed <span id="count-completed" class="badge">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="clearCompletedBtn" class="clear-btn">🗑️ Clear Completed</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>My Study & Project Tasks</h1>
          <p class="subtitle">Organize assignments, exams, and daily goals</p>
        </div>
        <div class="progress-card">
          <span>Completion Progress</span>
          <strong id="progressText">0%</strong>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>
      </header>

      <!-- Add Task Form -->
      <form id="taskForm" class="task-form">
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task (e.g., Complete Java Assignment)..."
          required
        />
        <select id="categoryInput">
          <option value="Assignment">Assignment</option>
          <option value="Exam Prep">Exam Prep</option>
          <option value="Project">Project</option>
          <option value="Personal">Personal</option>
        </select>
        <input type="date" id="dateInput" />
        <button type="submit" class="add-btn">+ Add Task</button>
      </form>

      <!-- Task List -->
      <section class="task-list-wrapper">
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyState" class="empty-state hidden">
          <p>No tasks found in this view. Add a task above to get started!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
